    <!--
      다크 모드 FOUC 방지: React 마운트 전에 테마를 결정해 배경색을 확정한다.
      이 스크립트가 없으면 다크 모드 사용자는 흰 화면이 번쩍인 뒤 어두워진다.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode = stored ? JSON.parse(stored) : 'auto';
          if (mode !== 'light' && mode !== 'dark') mode = 'auto';
          var resolved =
            mode === 'auto'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
          root.style.background = resolved === 'dark' ? '#000000' : '#eef0f4';
        } catch (e) {
          /* localStorage 차단(사생활 보호 모드 등) 시 라이트로 폴백 */
        }
      })();
    </script>
